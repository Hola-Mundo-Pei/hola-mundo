<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <title>Dona</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/window.css">
</head>
<body>

  <!--
    NOTA: al igual que las otras páginas, esta ventana se integrará como
    overlay flotante sobre index.html cuando trabajemos el JS.
  -->
  <div class="desktop-backdrop">
    <section class="window" aria-label="Dona">

      <!-- Barra de título estilo navegador -->
      <div class="window__titlebar">
        <div class="window__menu">
          <img src="assets/img/icon/window-icon-menu.png" alt="">
          <img src="assets/img/icon/icon-chevron-down.png" alt="">
        </div>

        <div class="window__address">
          <span class="window__address-title">Qué es hola mundo</span>
        </div>

        <div class="window__actions">
          <a href="index.html" class="window__action-btn" aria-label="Minimizar">
            <img src="assets/img/icon/minimizar.svg" alt="">
          </a>
          <button class="window__action-btn" aria-label="Maximizar">
            <img src="assets/img/icon/ampliar.svg" alt="">
          </button>
          <a href="index.html" class="window__action-btn" aria-label="Cerrar ventana">
            <img src="assets/img/icon/cerrar.svg" alt="">
          </a>
        </div>
      </div>

      <!-- Cuerpo / contenido -->
      <div class="window__body">
        <article>

          <header class="article-header article-header--no-image">
            <h1 class="article-header__title">Dona</h1>
            <p class="article-header__desc">Con tu aporte, un niño o una niña tiene acceso a herramientas que pueden cambiar su mundo.<br>No importa el monto. Lo que das se convierte en clases, en proyectos, en oportunidades reales.</p>
          </header>

          <section class="article-section">
            <div class="donate-method">
              <h2 class="donate-method__title">Nequi</h2>
              <div class="donate-method__image">
                <img src="assets/img//donar/donar-nequi.png" alt="Código QR para donar por Nequi">
              </div>
              <p class="donate-method__phone">324 685 9025</p>
              <button class="btn btn--primary btn--small">Donar</button>
            </div>
          </section>

        </article>
      </div>

    </section>
  </div>

  <script src="assets/js/main.js"></script>
</body>
</html>
